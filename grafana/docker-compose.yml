name: grafana

services:
  lgtm:
    image: grafana/otel-lgtm
    container_name: lgtm          # --name lgtm
    ports:
      - "3000:3000"               # -p 3000:3000
      - "4317:4317"               # -p 4317:4317
      - "4318:4318"               # -p 4318:4318
    stdin_open: true              # -i (interactive)
    tty: true                     # -t (pseudo‑TTY)