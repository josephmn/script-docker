version: "3.1"
networks:
    wordpress-net:
        driver: bridge

volumes:
    dbMysql:
    dataWordpress:

name: wordpress

services:
    database:
        image: mysql:8.3.0
        container_name: ${CONTAINER_NAME}-mysql
        env_file: .env
        tty: true
        ports:
            - "4208:3306"
        volumes:
            - ./dbMysql:/var/lib/mysql
        environment:
            MYSQL_DATABASE: ${DATABASE_NAME}
            MYSQL_PASSWORD: ${DATABASE_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
            MYSQL_USER: ${DATABASE_USER}
        healthcheck:
            test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p$$DATABASE_ROOT_PASSWORD" ]
            timeout: 20s
            retries: 10
        networks:
            - wordpress-net

    wordpress:
        image: wordpress:6.9.1
        container_name: ${CONTAINER_NAME}-wordpress
        env_file: .env
        ports:
            - "4282:80"
        volumes:
            - ./dataWordpress:/var/www/html
        environment:
            WORDPRESS_DB_HOST: database:3306
            WORDPRESS_DB_NAME: ${DATABASE_NAME}
            WORDPRESS_DB_USER: ${DATABASE_USER}
            WORDPRESS_DB_PASSWORD: ${DATABASE_PASSWORD}
        depends_on:
            - database
        networks:
            - wordpress-net

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: ${CONTAINER_NAME}-phpmyadmin
        env_file: .env
        ports:
            - "4283:80"
        environment:
            PMA_HOST: ${CONTAINER_NAME}-mysql
            MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
        depends_on:
            - database
        networks:
            - wordpress-net